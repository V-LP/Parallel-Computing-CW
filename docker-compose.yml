services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      CHUNK_SIZE_KB: ${CHUNK_SIZE_KB:-100}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      OLLAMA_SEED: ${OLLAMA_SEED:-42}
      SEARCH_THREADS: ${SEARCH_THREADS:-}
    volumes:
      - ./data:/data:ro
    # mem_limit: ${SERVER_MEM_LIMIT}
    depends_on:
      ollama:
        condition: service_healthy

  cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: cli/Dockerfile
    environment:
      SEARCH_URL: http://server:8080
    depends_on:
      server:
        condition: service_started

volumes:
  ollama_models:
