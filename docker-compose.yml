services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
    volumes:
      - ./data:/data:ro
    # Optional memory limit for the server container (the JVM heap is 75% of it). Example:
    #   SERVER_MEM_LIMIT=8g docker compose up --build   (then uncomment the next line)
    # mem_limit: ${SERVER_MEM_LIMIT}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
