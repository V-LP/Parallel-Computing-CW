services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    volumes:
      - ./data:/data:ro
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
